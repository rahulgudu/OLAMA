[project]
name = "nexus-ai-backend"
version = "0.1.0"
description = "Nexus AI GraphRAG engine — ChromaDB vector search, Neo4j graph traversal, live web search, and Ollama streaming, exposed via FastAPI."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    "ollama>=0.6.2",
    "chromadb>=1.5.9",
    "neo4j>=6.2.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.14.4",
]

[tool.uv]
package = false
